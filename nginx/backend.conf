upstream fastapibackend {
    server backend:8000;
}

server {
    listen 80;
    
    
    resolver 127.0.0.11 valid=5s;

    location /api/v1/ {
        proxy_pass http://fastapibackend/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        
        set $target http://frontend:80;
        proxy_pass $target;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
